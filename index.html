<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LabelNerd Matrix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #020617; color: #f8fafc;
            min-height: 100vh; font-family: sans-serif;
            padding: 16px; display: flex; flex-direction: column; gap: 16px;
        }
        header {
            border-bottom: 1px solid #1e293b; padding-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        h1 { font-size: 1.25rem; font-weight: 800; color: #38bdf8; }

        /* The Animation Orb replacing the heavy 3D engine */
        .matrix-orb-container {
            height: 120px; display: flex; align-items: center; justify-content: center;
            background: #0f172a; border-radius: 12px; border: 1px solid #1e293b;
        }
        .orb {
            width: 40px; height: 40px; border-radius: 50%; background: #22d3ee;
            box-shadow: 0 0 20px #06b6d4; transition: all 0.5s ease;
        }
        .orb.active {
            transform: scale(1.5); background: #34d399; box-shadow: 0 0 30px #10b981;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1.3); } to { transform: scale(1.6); } }

        .control-deck {
            background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .deck-header { display: flex; justify-content: space-between; font-size: 12px; }
        #demo-btn { color: #38bdf8; background: none; border: none; cursor: pointer; text-decoration: underline; }
        textarea {
            width: 100%; height: 80px; background: #020617; border: 1px solid #1e293b;
            border-radius: 8px; padding: 10px; color: white; resize: none; font-size: 13px;
        }
        #analyze-btn {
            width: 100%; background: #38bdf8; border: none; border-radius: 8px;
            padding: 12px; color: #020617; font-weight: 700; cursor: pointer;
        }
        .card {
            background: #0f172a; border: 1px solid #1e293b; border-radius: 12px;
            padding: 14px; margin-top: 12px; display: flex; flex-direction: column; gap: 6px;
        }
        .card-title { font-weight: 700; color: #f8fafc; font-size: 14px; }
        .card-class { color: #38bdf8; font-size: 11px; font-family: monospace; }
        .card-text { color: #94a3b8; font-size: 12px; line-height: 1.4; }
    </style>
</head>
<body>

    <header>
        <h1>🧪 LABELNERD v2.0</h1>
        <span style="font-size: 11px; color: #94a3b8; font-family: monospace;">READY</span>
    </header>

    <div class="matrix-orb-container">
        <div id="matrix-orb" class="orb"></div>
    </div>

    <div class="control-deck">
        <div class="deck-header">
            <span>Ingredient Input Payload</span>
            <button id="demo-btn">⚡ Load Nerd Sample</button>
        </div>
        <textarea id="ingredient-input" placeholder="Paste ingredients list here..."></textarea>
        <button id="analyze-btn">🔬 Compute Analysis</button>
    </div>

    <div id="cards-list"></div>

    <script>
        const dictionary = {
            "microcrystalline cellulose": { name: "Microcrystalline Cellulose", class: "Bulking Agent / Binder", text: "Refined wood pulp. Gives structural substance to a pill so it's physically large enough to hold. It acts as a biocompatible sponge that helps tablets break apart perfectly in the stomach." },
            "magnesium stearate": { name: "Magnesium Stearate", class: "Flow Agent / Lubricant", text: "A magnesium salt mixed with fatty acids. It acts as a lubricant to prevent supplement ingredients from sticking to industrial machinery during encapsulation. Highly debated by purists, but technically safe in low doses." },
            "silicon dioxide": { name: "Silicon Dioxide", class: "Anti-Caking Agent", text: "Essentially pure, microscopic quartz sand. It absorbs ambient moisture and prevents powders from clumping up, ensuring absolute uniformity and accurate milligram dosing per capsule." },
            "titanium dioxide": { name: "Titanium Dioxide", class: "Color Opacifier (Scrutinized)", text: "A mineral used strictly to turn supplement pills bright white or opaque to protect light-sensitive ingredients. Increasingly banned or heavily restricted in food items globally due to nanoparticle cellular accumulation concerns." }
        };

        document.getElementById('demo-btn').addEventListener('click', () => {
            document.getElementById('ingredient-input').value = "Microcrystalline Cellulose, Titanium Dioxide, Magnesium Stearate, Silicon Dioxide";
        });

        document.getElementById('analyze-btn').addEventListener('click', () => {
            const input = document.getElementById('ingredient-input').value.toLowerCase();
            const list = document.getElementById('cards-list');
            const orb = document.getElementById('matrix-orb');

            list.innerHTML = '';
            let found = false;

            Object.keys(dictionary).forEach(key => {
                if (input.includes(key)) {
                    found = true;
                    const item = dictionary[key];
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-title">✨ ${item.name}</div>
                        <div class="card-class">${item.class}</div>
                        <div class="card-text">${item.text}</div>
                    `;
                    list.appendChild(card);
                }
            });

            if (found) {
                orb.classList.add('active');
            } else {
                orb.classList.remove('active');
                list.innerHTML = '<div style="text-align:center;color:#64748b;font-size:12px;margin-top:12px;">No matches found.</div>';
            }
        });
    </script>
</body>
</html>
