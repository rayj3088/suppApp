<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LABELNERD v3.0</title>
  <style>
    :root {
      --neon-purple: #b026ff;
      --neon-green: #39ff14;
      --neon-red: #ff3333;
      --neutral-blue: #3a86ff;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text-main: #f5f5f5;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-container {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 2rem;
    }

    /* THE ORB */
    #status-orb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--neutral-blue);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: background 0.3s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px var(--neon-purple); }
      100% { transform: scale(1.2); box-shadow: 0 0 20px var(--neon-purple); }
    }

    textarea {
      width: 100%;
      max-width: 600px;
      height: 150px;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 1rem;
      font-size: 1rem;
      margin-bottom: 1rem;
      resize: vertical;
    }

    button {
      background-color: var(--neutral-blue);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    #output-container {
      width: 100%;
      max-width: 600px;
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--card-bg);
      border-left: 4px solid var(--neutral-blue);
      padding: 1rem;
      border-radius: 4px;
    }

    .card.success { border-left-color: var(--neon-green); }
    .card.error { border-left-color: var(--neon-red); }
  </style>
</head>
<body>

  <div class="header-container">
    <div id="status-orb"></div>
    <h1>LABELNERD v3.0</h1>
  </div>

  <textarea id="ingredient-input" placeholder="Paste supplement label ingredients here... (e.g., magnesium stearate, silicon dioxide)"></textarea>

  <div>
    <button onclick="handleProcessClick()">Analyze Label Matrix</button>
    <button onclick="saveCurrentToFavorites()" style="background: #444; margin-left: 10px;">Save Favorites</button>
  </div>

  <div id="output-container"></div>

  <script>
    // ==========================================
    // 1. ARCHITECTURE & PERSISTENCE STATE
    // ==========================================
    const BASELINE_DICTIONARY = {
      "magnesium stearate": "Lubricant: Stops powders from sticking to factory machines.",
      "silicon dioxide": "Anti-caking: Absorbs ambient humidity so powder won't clump."
    };

    let latestIngredientMatrix = null;
    let latestSupplementName = "Scanned Supplement " + new Date().toLocaleTimeString();

    function checkLocalDictionary(inputText) {
      const matches = {};
      const lowerText = inputText.toLowerCase();
      for (const [ingredient, description] of Object.entries(BASELINE_DICTIONARY)) {
        if (lowerText.includes(ingredient)) {
          matches[ingredient] = description;
        }
      }
      return matches;
    }

    async function runBrowserNativeAI(inputText) {
      // Mocking the experimental window.ai for demonstration
      if(window.ai && window.ai.languageModel) {
          const session = await window.ai.languageModel.create();
          return await session.prompt(`Explain these supplement ingredients: ${inputText}`);
      }
      return "Browser AI not detected. (Mock response triggered)";
    }

    async function fetchFromServerProxyAPI(inputText) {
      // Stub for future backend deployment
      return new Promise(resolve => {
        setTimeout(() => resolve("Server API fallback response triggered for unstructured text."), 1000);
      });
    }

    // ==========================================
    // 2. FETCH & DECIPHER ENGINE SWITCHBOARD
    // ==========================================

async function searchGovernmentAPI(productName) {
  try {
    updateUIState("THINKING_ORB_ACTIVE");

    // Step 1: Search the NIH database by product name keyword
    const searchUrl = `https://api.ods.od.nih.gov/dsld/v9/browse-products/?method=by_keyword&q=${encodeURIComponent(productName)}`;
    const searchResponse = await fetch(searchUrl);
    const searchData = await searchResponse.json();

    if (!searchData || searchData.length === 0) {
      throw new Error("No supplements found matching that name.");
    }

    // Step 2: Grab the DSLD ID of the first/best match to get the actual label
    // (Note: You may need to adjust the exact JSON parsing based on the API's array structure)
    const firstMatchId = searchData[0].dsldId;

    // Step 3: Fetch the full, official label data
    const labelUrl = `https://api.ods.od.nih.gov/dsld/v9/label/${firstMatchId}`;
    const labelResponse = await fetch(labelUrl);
    const labelData = await labelResponse.json();

    console.log("Official Government Label Data:", labelData);

    // You would then pass the ingredients from labelData into your local dictionary logic
    updateUIState("SUCCESS_ORB_ACTIVE");
    return labelData;

  } catch (error) {
    console.error("Government API Error:", error);
    updateUIState("ERROR_ORB_ACTIVE");
    renderFallbackUI(error.message);
  }
}

    async function processSupplementLabel(rawInputText) {
      updateUIState("THINKING_ORB_ACTIVE");
      const outputContainer = document.getElementById("output-container");
      outputContainer.innerHTML = "";

      let foundMatches = checkLocalDictionary(rawInputText);
      latestIngredientMatrix = foundMatches;

      try {
        let decipheredText = "";

        // Strategy 1: Browser-Native AI
        if (window.ai && window.ai.languageModel) {
          decipheredText = await runBrowserNativeAI(rawInputText);
        }
        // Strategy 2: Server API Fallback
        else {
          decipheredText = await fetchFromServerProxyAPI(rawInputText);
        }

        renderOutputCards(foundMatches, decipheredText);
        updateUIState("SUCCESS_ORB_ACTIVE");
      } catch (error) {
        console.error(error);
        renderFallbackUI("Connection or processing limit reached.");
        updateUIState("ERROR_ORB_ACTIVE");
      }
    }

    function handleProcessClick() {
      const text = document.getElementById("ingredient-input").value;
      if (!text.trim()) return;
      processSupplementLabel(text);
    }

    // ==========================================
    // 3. GRAPHICS & INTUITIVE DISCOVERY
    // ==========================================
    function updateUIState(stateType) {
      const orb = document.getElementById("status-orb");
      switch (stateType) {
        case "THINKING_ORB_ACTIVE":
          orb.style.animation = "pulse 0.5s infinite alternate";
          orb.style.background = "var(--neon-purple)";
          break;
        case "SUCCESS_ORB_ACTIVE":
          orb.style.animation = "none";
          orb.style.background = "var(--neon-green)";
          break;
        case "ERROR_ORB_ACTIVE":
          orb.style.animation = "none";
          orb.style.background = "var(--neon-red)";
          break;
        default:
          orb.style.animation = "none";
          orb.style.background = "var(--neutral-blue)";
      }
    }

    function renderOutputCards(matches, deciphered) {
      const container = document.getElementById("output-container");

      // Render Local Matches
      if (Object.keys(matches).length > 0) {
        let matchHTML = `<strong>Known Excipients Detected:</strong><ul>`;
        for (const [ing, desc] of Object.entries(matches)) {
          matchHTML += `<li><strong>${ing}:</strong> ${desc}</li>`;
        }
        matchHTML += `</ul>`;
        container.innerHTML += `<div class="card success">${matchHTML}</div>`;
      } else {
        container.innerHTML += `<div class="card">No known excipients found in local dictionary.</div>`;
      }

      // Render AI/Server Deciphered Text
      container.innerHTML += `<div class="card"><strong>Intelligence Layer Output:</strong><br><br>${deciphered}</div>`;
    }

    function renderFallbackUI(message) {
      const container = document.getElementById("output-container");
      container.innerHTML = `<div class="card error"><strong>Error:</strong> ${message}</div>`;
    }

    // ==========================================
    // 4. DATA PERSISTENCE
    // ==========================================
    function saveToMomFavorites(supplementName, ingredientMatrix) {
      if (!ingredientMatrix) return alert("Nothing to save yet! Analyze a label first.");

      const currentLog = JSON.parse(localStorage.getItem("moms_matrix")) || [];
      currentLog.push({
        name: supplementName,
        data: ingredientMatrix,
        date: Date.now()
      });
      localStorage.setItem("moms_matrix", JSON.stringify(currentLog));
      alert(`Saved "${supplementName}" to Mom's Favorites!`);
    }

    function saveCurrentToFavorites() {
      saveToMomFavorites(latestSupplementName, latestIngredientMatrix);
    }
  </script>
</body>
</html>
